spring:
  application:
    name: chatbot

  # 응답 Content-Type 에 charset=UTF-8 을 강제로 붙인다 (CharacterEncodingFilter)
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
    # 컨테이너(Tomcat multipart) 한도. 애플리케이션 한도(app.ingest.max-file-size=20MB)보다
    # 일부러 여유 있게 25MB로 둔다 — 같게 두면 우리 검증 코드에 도달하기 전에 컨테이너가
    # 먼저 요청을 끊어 413 응답 검증(document-ingestion Spec AC-3)이 흔들린다
    # (Tech Review AD-6).
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # rag/ingest 의 ingestExecutor 빈(Executor 타입)이 존재하면 부트의 applicationTaskExecutor
  # 자동설정이 통째로 꺼진다 — TaskExecutorConfigurations.OnExecutorCondition 의 첫 분기가
  # @ConditionalOnMissingBean(Executor.class) 이기 때문이다 (spring-boot-autoconfigure:4.1.1 소스 확인).
  # 그 빈이 사라지면 WebMvcAutoConfiguration 이 MVC 비동기 실행기를 설치하지 않아 SSE 가
  # 요청당 스레드를 새로 만드는 SimpleAsyncTaskExecutor 로 조용히 강등된다.
  # force 는 같은 조건의 두 번째 분기라, applicationTaskExecutor 를 ingestExecutor 와 함께 살려둔다.
  # ingestExecutor 빈이 사라지지 않는 한 이 줄을 지우지 않는다 (document-ingestion T8).
  task:
    execution:
      mode: force

  # StringHttpMessageConverter 의 기본 charset (기본값이 ISO-8859-1 인 경로 대비)
  http:
    converters:
      string-encoding-charset: UTF-8

  # T11(chat:AC-33): usage.cost(BigDecimal, 예: 2.25E-6)가 SSE 응답에서 지수 표기로 직렬화되지
  # 않도록 고정 소수점(plain) 표기를 강제한다. Boot 4 기본 Jackson 은 tools.jackson(Jackson 3)
  # 이라 classic Jackson 2의 spring.jackson.generator.* 경로가 아니라 spring.jackson.write.*
  # (tools.jackson.core.StreamWriteFeature 바인딩, spring-boot-jackson-4.1.1 JacksonProperties
  # 바이트코드로 확인)를 쓴다.
  # --- 적용 범위 (2026-08-29 리뷰 L4) ---
  # 이 설정은 앱 전역 직렬화에 적용되므로 T11 범위(usage.cost) 밖의 BigDecimal 필드 표기도
  # 함께 바뀐다 -- 실측 대상: usage/ModelUsage·UsageTotals·UsageSummary·UsageController
  # (GET /api/admin/usage 의 totalCostUsd/costUsd), eval/judge/EvalResponse,
  # eval/report/EvalReportRow·EvalReportAggregator, chat/domain/Message. 값 자체가 아니라
  # 표기(지수 vs 고정소수점)만 바뀌므로 이 필드들의 정합성에는 영향이 없다.
  jackson:
    write:
      write-bigdecimal-as-plain: true

  # infra/.env 를 프로퍼티 소스로 읽는다.
  # 터미널 실행 시 cwd=backend/, IntelliJ 실행 시 cwd=프로젝트 루트일 수 있어 두 경로를 모두 시도한다.
  # [.properties] 로 파싱되므로 export/따옴표/백슬래시를 값에 쓰지 않는다.
  config:
    import:
      - optional:file:../infra/.env[.properties]
      - optional:file:./infra/.env[.properties]

  datasource:
    # 앱·Flyway 는 부트스트랩 슈퍼유저(DB_USER/DB_PASSWORD, compose POSTGRES_USER)가 아니라
    # infra/init-db 가 만드는 비슈퍼유저 역할로 접속한다 (review 2026-08-25 High-1 —
    # 런타임 계정이 슈퍼유저면 rolbypassrls 로 인해 RLS 등 DB 계층 권한 통제가 불가능해진다).
    # 기본값 없음 — infra/.env 의 APP_DB_USER/APP_DB_PASSWORD 가 필수다. 약한 인라인
    # 폴백(:chatbot_app 등)을 두면 .env 로딩이 실패해도 조용히 그 값으로 접속을
    # 시도해 문제를 감춘다 (review 2026-08-25 Medium-1). DB_URL 은 로컬 전용 값이라
    # 유지하되(호스트/포트/DB명이 비밀값이 아님), 계정 자격증명만 필수로 강제한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatbot}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate        # 스키마의 주인은 Flyway
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  ai:
    openai:
      # Spring AI 2.0 = 공식 OpenAI Java SDK 래핑. baseUrl 에 /v1 을 포함한다.
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY}
      chat:
        model: ${CHAT_MODEL_DEFAULT}
        temperature: 0.7
      embedding:
        model: ${EMBEDDING_MODEL:baai/bge-m3}

    vectorstore:
      pgvector:
        table-name: vector_store_bgem3   # 기본값(vector_store)을 쓰지 않는다
        dimensions: 1024                 # bge-m3
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: false         # 계속 false 유지 — Flyway가 테이블·인덱스를 만든다.
                                          # true면 PgVectorStore가 임베딩 모델 교체 시 차원이
                                          # 안 맞는 테이블을 조용히 만들 수 있다 (기획서 §5.1).

app:
  auth:
    mode: none                # none | works
  search:
    mode: vector              # vector | hybrid (D6)
    top-k: 5
    rrf-k: 60
    weight-bm25: 0.5
    weight-vector: 0.5
    bm25-top-k: 20             # 기획서 §7 "top 20" 을 상수 대신 프로퍼티로 (hybrid-rag Spec §8-D3)
    vector-top-k: 20           # 동상
    score-threshold: 0.0       # 잠정 비활성. R6 로 필요성은 확정, 수치는 D7 튜닝 대상 (hybrid-rag Spec §8-D2)
  rerank:
    enabled: false
    model: ${RERANK_MODEL:cohere/rerank-v3.5}
    # RestClient 연결/읽기 타임아웃. D7 튜닝 전 잠정값 — 실측 근거 없이 넉넉하게 잡은 값이다.
    # 타임아웃 자체가 없으면 OpenRouter 응답 지연 시 요청 스레드가 무기한 블로킹된다
    # (hybrid-rag Spec T6 review 2026-08-27 High-1). D7에서 실측 후 교체 예정.
    connect-timeout: 5s
    read-timeout: 10s
  ingest:
    # 업로드 원본 저장 위치. 기본값 없음 — infra/.env 의 UPLOAD_DIR 이 필수다 (document-ingestion Spec T1).
    upload-dir: ${UPLOAD_DIR}
    max-file-size: 20MB       # 애플리케이션 한도. spring.servlet.multipart 한도(25MB)보다 먼저 걸린다
    allowed-mime-types:       # §7 OQ-2 확정값
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - text/plain
      - text/markdown
    chunk-size: 2000           # §7 OQ-1 확정값. TokenTextSplitter 는 overlap 파라미터가 없다
    min-chunk-size-chars: 500
    max-document-count: 100    # 무인증 업로드 API 의 누적 총량 상한. 초과 시 거부는 T5 소관 (review 2026-08-25 Medium-2)
  session:
    # anonymous auth_provider 행의 누적 총량 상한. 쿠키 없음/손상/미확인 값이 오면 매 요청이
    # 신규 행을 만들 수 있어(chat:AC-9/12) 크롤러·스캐너에 users 테이블이 무제한으로 자랄 수
    # 있다 (T4 review 2026-08-26 High-2). 1000은 1단계(발표자 로컬 데모) 기준 상한이며 용량
    # 산정치가 아니다 — 2단계(사내망 공개)·3단계(서비스 배포) 전환 시점에 Spec R-6과 함께
    # 반드시 재검토해야 한다. 이전에는 AppProperties.Session의 @DefaultValue("1000")로만
    # 존재해 yaml만 보고는 이 상한의 존재를 알 수 없었다 (T4 review round 2, Medium 병합).
    max-anonymous-users: 1000
    # 사용자 1명이 보유 가능한(소프트 삭제 제외) conversations 행 수 상한. 이 API도 무인증이라
    # 쿠키 하나로 반복 호출하면 max-anonymous-users(사용자 행 자체의 상한)와 무관하게 그 한
    # 사용자 아래 conversations 행이 무제한으로 늘어난다 (T6 review 2026-08-27 Medium-2). 50은
    # 1단계 데모 기준 잠정값이며 실측 근거가 없다 -- eval-usage-dashboard Spec D7에서 재검토.
    max-conversations-per-user: 50
    # 대화 1개가 보유 가능한(role='user' 기준) messages 행 수 상한. T9부터 이 엔드포인트가 실제
    # 유료 OpenRouter 호출을 트리거하는데, 위 두 상한은 사용자 행·대화 행 수만 막을 뿐 같은
    # conversation_id로 반복 호출하는 것은 막지 못한다 -- 쿠키 하나로 같은 대화에 반복 호출하면
    # 두 상한 모두 도달하지 않은 채로 유료 호출이 무제한 발생할 수 있다 (T9 review 2026-08-27
    # Medium-3, 사용자 결정 D-3①). 200은 §7 OQ-7이 고정한 ChatMemory 윈도우(최근 20턴)의 10배로,
    # 정상적인 데모 대화량에는 넉넉하고 실측 근거는 없다 -- eval-usage-dashboard Spec D7에서 재검토.
    #
    # --- 정정 (2026-08-28, T10 리뷰 security Medium-1) ---
    # 위 "ChatMemory 윈도우(최근 20턴)의 10배" 도출은 윈도우를 행 수 축으로만 계산한 것이다 --
    # T9 시점에는 프롬프트가 이번 턴 user 메시지 1건뿐이었으므로 그 계산이 맞았다. T10이
    # `.messages(history)`로 멀티턴을 프롬프트에 실은 뒤로는 같은 200회 호출이 소비하는 프롬프트
    # 총량이 O(n)에서 O(n × 윈도우)로 바뀌어 이 도출은 낡았다 -- 이제 매 호출이 최대 40행
    # (user 20 + assistant 20)을 프롬프트에 싣는다. 실측(2026-08-28 브라우저 검증 중 쌓인
    # messages 테이블 전체 집계 -- 대화 1개가 아니라 여러 대화에 걸친 합산이다 -- user 14건
    # min18/avg54/max111자, assistant 14건 min11/avg517/max1750자,
    # assistant가 user의 약 10배)을 20턴 윈도우로 투영하면 20×54 + 20×517 = 1,080 +
    # 10,340 = 11,420자로, 문자 기준 증폭 ≈ 211배다(리뷰가 계산한 "최대 40배"(리뷰 원문은 41로
    # 표기했으나 off-by-one)는 메시지 개수 기준이라 과소평가다 -- assistant 메시지가 user보다 훨씬
    # 길다는 사실을 반영하지 못한다). 한계 3가지 -- ① 문자 ≠ 토큰: 카탈로그 5개 모델의 토크나이저와
    # 한국어·영어 비율이 전부 달라 문자 기준 비율이 토큰 기준으로도 같다는 보장이 없다.
    # ② 211배는 관측이 아니라 투영이다 -- 실제 관측된 최대 대화는 6 메시지뿐이라 40행 윈도우가
    # 찬 적이 한 번도 없고, 517자 평균을 20턴으로 외삽한 값이다. ③ assistant 측은 출력 길이
    # 상한(maxTokens 등)이 전혀 없어 최악값이 미상이다 -- user 측 최악(20×4000=80,000자)은
    # 계산되지만 assistant 측은 계산되지 않는다. 이번 카드는 이 상한을 의도적으로 코드로 고치지
    # 않았다.
    # --- 갱신 (T11, 2026-08-29 착지) ---
    # assistant 행에 prompt_tokens/completion_tokens/cost_usd 실측 기록이 시작됐다
    # (ChatService#extractUsage/#extractCost). 그러나 maxTokens 도입 여부는 아직 그 실측만으로
    # 판단하지 않는다 -- 위 211배 수치는 여전히 투영이지 관측이 아니다(한계 ②): 40행 윈도우가
    # 찬 대화가 아직 없어 이 카드의 기록 자체가 그 투영을 확인/반증할 만큼 쌓이지 않았다.
    # 실운영 트래픽이 쌓여 cost_usd/토큰 이력이 충분해진 뒤 재판단한다. maxTokens는 출력과 다음 턴 재투입 양쪽을 동시에
    # 묶는 1급 모델 옵션이라 별도 토큰 예산 메커니즘을 새로 만드는 것보다 낫지만, 걸면
    # finish_reason=LENGTH가 발생하고 그것이 eval 판정을 환각으로 뒤집으며 사용자 화면에는 잘림
    # 표시가 없다(insight-chat-72에서 발견) -- 따라서 maxTokens 도입과 "LENGTH 잘림 표시 AC
    # 신설"은 함께 판단해야 한다. 현재 위험 수준: server.address: 127.0.0.1 로 로컬 데모 1인
    # 단계에 한정돼 있고 관측된 최대 대화도 6 메시지뿐이라 실질 위험은 작다 -- 이 전제는 Spec
    # R-6 ①단계(사내망 공개)에서 무너지므로 그 시점에 이 노트를 다시 열어야 한다. 계산 근거는
    # ChatService#streamReply Javadoc [Caution] 에도 동일하게 있다.
    max-messages-per-conversation: 200
  models:
    # GET /api/models 이 반환하는 고정 카탈로그 (chat Spec §5 A-10/A-11, T5).
    # 런타임에 OpenRouter GET /v1/models 를 호출하지 않는다 -- 호출하면 통합 테스트 중
    # 실제 OpenRouter로 나가는 요청이 생겨 chat:AC-35 를 깬다. 아래 5종 id는 T5 구현 시점에
    # 수동으로 GET https://openrouter.ai/api/v1/models 를 호출해 전부 실재함을 확인했다
    # (CLAUDE.md 금지 P1, docs/dev-log/backend.jsonl 이 카드의 note 참고). 전부 유료 모델이라
    # ':free' 접미사가 없다(CLAUDE.md 금지 P2) -- AppProperties.Models 컴팩트 생성자가 기동 시
    # 재검증한다.
    default-id: ${CHAT_MODEL_DEFAULT}
    items:
      - id: upstage/solar-pro4
        display-name: Solar Pro 4 (Upstage)
      - id: google/gemini-2.5-flash-lite
        display-name: Gemini 2.5 Flash-Lite (Google)
      - id: openai/gpt-5-mini
        display-name: GPT-5 mini (OpenAI)
      - id: google/gemini-2.5-flash
        display-name: Gemini 2.5 Flash (Google)
      - id: anthropic/claude-haiku-4.5
        display-name: Claude Haiku 4.5 (Anthropic)
  chat:
    memory:
      # ChatMemory 윈도우 크기 = 최근 20턴(user+assistant 각 1행) x 2 = 40행. §7 OQ-7 사용자 결정
      # ("최근 20턴 고정"). MessageChatMemoryRepository.findByConversationId 가 이 값만큼만 최근
      # messages 행을 잘라 LLM 프롬프트에 싣는다 (Tech Review A-5, T10).
      max-messages: 40

logging:
  level:
    art.insightai.chatbot: DEBUG
    org.springframework.ai: INFO

server:
  port: 8080
  # 1단계(발표자 로컬 데모) 한정 조치. Spec chat R-6은 무서명 UUID 쿠키·인증 없음을
  # "로컬 데모 한정"을 전제로 수용했는데, 실제로는 이 값이 없어 0.0.0.0(모든 인터페이스)에
  # 바인딩되고 있어 그 전제가 코드로 강제되지 않았다(T4 리뷰 2026-08-26 High-1).
  # 127.0.0.1로 고정해 같은 머신 밖에서는 접속 자체가 불가능하게 만든다.
  # 2단계(사내망 공개)·3단계(서비스 배포) 전환 시점에는 이 값을 다시 열어 Spec R-6을
  # 재검토해야 한다 — 영구 해결이 아니라 현 단계의 임시 조치다.
  address: 127.0.0.1