spring:
  application:
    name: chatbot

  # 응답 Content-Type 에 charset=UTF-8 을 강제로 붙인다 (CharacterEncodingFilter)
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
    # 컨테이너(Tomcat multipart) 한도. 애플리케이션 한도(app.ingest.max-file-size=20MB)보다
    # 일부러 여유 있게 25MB로 둔다 — 같게 두면 우리 검증 코드에 도달하기 전에 컨테이너가
    # 먼저 요청을 끊어 413 응답 검증(document-ingestion Spec AC-3)이 흔들린다
    # (Tech Review AD-6).
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # StringHttpMessageConverter 의 기본 charset (기본값이 ISO-8859-1 인 경로 대비)
  http:
    converters:
      string-encoding-charset: UTF-8

  # infra/.env 를 프로퍼티 소스로 읽는다.
  # 터미널 실행 시 cwd=backend/, IntelliJ 실행 시 cwd=프로젝트 루트일 수 있어 두 경로를 모두 시도한다.
  # [.properties] 로 파싱되므로 export/따옴표/백슬래시를 값에 쓰지 않는다.
  config:
    import:
      - optional:file:../infra/.env[.properties]
      - optional:file:./infra/.env[.properties]

  datasource:
    # 앱·Flyway 는 부트스트랩 슈퍼유저(DB_USER/DB_PASSWORD, compose POSTGRES_USER)가 아니라
    # infra/init-db 가 만드는 비슈퍼유저 역할로 접속한다 (review 2026-08-25 High-1 —
    # 런타임 계정이 슈퍼유저면 rolbypassrls 로 인해 RLS 등 DB 계층 권한 통제가 불가능해진다).
    # 기본값 없음 — infra/.env 의 APP_DB_USER/APP_DB_PASSWORD 가 필수다. 약한 인라인
    # 폴백(:chatbot_app 등)을 두면 .env 로딩이 실패해도 조용히 그 값으로 접속을
    # 시도해 문제를 감춘다 (review 2026-08-25 Medium-1). DB_URL 은 로컬 전용 값이라
    # 유지하되(호스트/포트/DB명이 비밀값이 아님), 계정 자격증명만 필수로 강제한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatbot}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate        # 스키마의 주인은 Flyway
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  ai:
    openai:
      # Spring AI 2.0 = 공식 OpenAI Java SDK 래핑. baseUrl 에 /v1 을 포함한다.
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY}
      chat:
        model: ${CHAT_MODEL_DEFAULT}
        temperature: 0.7
      embedding:
        model: ${EMBEDDING_MODEL:baai/bge-m3}

    vectorstore:
      pgvector:
        table-name: vector_store_bgem3   # 기본값(vector_store)을 쓰지 않는다
        dimensions: 1024                 # bge-m3
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: false         # 계속 false 유지 — Flyway가 테이블·인덱스를 만든다.
                                          # true면 PgVectorStore가 임베딩 모델 교체 시 차원이
                                          # 안 맞는 테이블을 조용히 만들 수 있다 (기획서 §5.1).

app:
  auth:
    mode: none                # none | works
  search:
    mode: vector              # vector | hybrid (D6)
    top-k: 5
    rrf-k: 60
    weight-bm25: 0.5
    weight-vector: 0.5
    bm25-top-k: 20             # 기획서 §7 "top 20" 을 상수 대신 프로퍼티로 (hybrid-rag Spec §8-D3)
    vector-top-k: 20           # 동상
    score-threshold: 0.0       # 잠정 비활성. R6 로 필요성은 확정, 수치는 D7 튜닝 대상 (hybrid-rag Spec §8-D2)
  rerank:
    enabled: false
    model: ${RERANK_MODEL:cohere/rerank-v3.5}
    # RestClient 연결/읽기 타임아웃. D7 튜닝 전 잠정값 — 실측 근거 없이 넉넉하게 잡은 값이다.
    # 타임아웃 자체가 없으면 OpenRouter 응답 지연 시 요청 스레드가 무기한 블로킹된다
    # (hybrid-rag Spec T6 review 2026-08-27 High-1). D7에서 실측 후 교체 예정.
    connect-timeout: 5s
    read-timeout: 10s
  ingest:
    # 업로드 원본 저장 위치. 기본값 없음 — infra/.env 의 UPLOAD_DIR 이 필수다 (document-ingestion Spec T1).
    upload-dir: ${UPLOAD_DIR}
    max-file-size: 20MB       # 애플리케이션 한도. spring.servlet.multipart 한도(25MB)보다 먼저 걸린다
    allowed-mime-types:       # §7 OQ-2 확정값
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - text/plain
      - text/markdown
    chunk-size: 2000           # §7 OQ-1 확정값. TokenTextSplitter 는 overlap 파라미터가 없다
    min-chunk-size-chars: 500
    max-document-count: 100    # 무인증 업로드 API 의 누적 총량 상한. 초과 시 거부는 T5 소관 (review 2026-08-25 Medium-2)
  session:
    # anonymous auth_provider 행의 누적 총량 상한. 쿠키 없음/손상/미확인 값이 오면 매 요청이
    # 신규 행을 만들 수 있어(chat:AC-9/12) 크롤러·스캐너에 users 테이블이 무제한으로 자랄 수
    # 있다 (T4 review 2026-08-26 High-2). 1000은 1단계(발표자 로컬 데모) 기준 상한이며 용량
    # 산정치가 아니다 — 2단계(사내망 공개)·3단계(서비스 배포) 전환 시점에 Spec R-6과 함께
    # 반드시 재검토해야 한다. 이전에는 AppProperties.Session의 @DefaultValue("1000")로만
    # 존재해 yaml만 보고는 이 상한의 존재를 알 수 없었다 (T4 review round 2, Medium 병합).
    max-anonymous-users: 1000
    # 사용자 1명이 보유 가능한(소프트 삭제 제외) conversations 행 수 상한. 이 API도 무인증이라
    # 쿠키 하나로 반복 호출하면 max-anonymous-users(사용자 행 자체의 상한)와 무관하게 그 한
    # 사용자 아래 conversations 행이 무제한으로 늘어난다 (T6 review 2026-08-27 Medium-2). 50은
    # 1단계 데모 기준 잠정값이며 실측 근거가 없다 -- eval-usage-dashboard Spec D7에서 재검토.
    max-conversations-per-user: 50
  models:
    # GET /api/models 이 반환하는 고정 카탈로그 (chat Spec §5 A-10/A-11, T5).
    # 런타임에 OpenRouter GET /v1/models 를 호출하지 않는다 -- 호출하면 통합 테스트 중
    # 실제 OpenRouter로 나가는 요청이 생겨 chat:AC-35 를 깬다. 아래 5종 id는 T5 구현 시점에
    # 수동으로 GET https://openrouter.ai/api/v1/models 를 호출해 전부 실재함을 확인했다
    # (CLAUDE.md 금지 P1, docs/dev-log/backend.jsonl 이 카드의 note 참고). 전부 유료 모델이라
    # ':free' 접미사가 없다(CLAUDE.md 금지 P2) -- AppProperties.Models 컴팩트 생성자가 기동 시
    # 재검증한다.
    default-id: ${CHAT_MODEL_DEFAULT}
    items:
      - id: upstage/solar-pro4
        display-name: Solar Pro 4 (Upstage)
      - id: google/gemini-2.5-flash-lite
        display-name: Gemini 2.5 Flash-Lite (Google)
      - id: openai/gpt-5-mini
        display-name: GPT-5 mini (OpenAI)
      - id: google/gemini-2.5-flash
        display-name: Gemini 2.5 Flash (Google)
      - id: anthropic/claude-haiku-4.5
        display-name: Claude Haiku 4.5 (Anthropic)

logging:
  level:
    art.insightai.chatbot: DEBUG
    org.springframework.ai: INFO

server:
  port: 8080
  # 1단계(발표자 로컬 데모) 한정 조치. Spec chat R-6은 무서명 UUID 쿠키·인증 없음을
  # "로컬 데모 한정"을 전제로 수용했는데, 실제로는 이 값이 없어 0.0.0.0(모든 인터페이스)에
  # 바인딩되고 있어 그 전제가 코드로 강제되지 않았다(T4 리뷰 2026-08-26 High-1).
  # 127.0.0.1로 고정해 같은 머신 밖에서는 접속 자체가 불가능하게 만든다.
  # 2단계(사내망 공개)·3단계(서비스 배포) 전환 시점에는 이 값을 다시 열어 Spec R-6을
  # 재검토해야 한다 — 영구 해결이 아니라 현 단계의 임시 조치다.
  address: 127.0.0.1