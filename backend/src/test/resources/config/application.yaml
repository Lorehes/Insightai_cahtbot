# ⚠ 경고: 이 파일을 지우거나 이름을 바꾸지 말 것. IntegrationTestBase를 상속하지 않는
# @SpringBootTest(예: migration 패키지)와 IntelliJ 직접 실행이 실제 OpenRouter 키로 나갈 수 있게
# 되는 통로를 이 파일 하나가 막고 있다(review 2026-08-27_document-ingestion-T4-round2.md High-1).
# 지우면 art.insightai.chatbot.support.ConfigApplicationYamlAppliesOutsideIntegrationTestBaseTest
# 가 즉시 실패한다 -- 그게 이 파일의 존재를 증명하는 유일한 회귀 감지 수단이다. 그 테스트를
# 먼저 읽지 않고 이 파일을 수정하지 말 것.
#
# 프로파일이 없는(default) 테스트 클래스패스 설정 파일. Spring Boot가 활성 프로파일과 무관하게
# 항상 로드하는 config-data 위치 중 하나("classpath:/config/", 기본 spring.config.location
# 검색 목록의 일부)에 놓여 있다 -- application-test.yaml(프로파일 전용, @ActiveProfiles("test")
# 로만 활성화됨)과 달리, IntegrationTestBase를 상속하지 않는 @SpringBootTest(예: 마이그레이션
# 패키지의 스키마 검증 테스트)에도, 그리고 실행 방식(./mvnw test든 IntelliJ 직접 실행이든)과도
# 무관하게 적용된다.
#
# [경로에 관한 실측 함정] 이 파일을 처음에는 src/test/resources/application.yaml(= classpath:/
# application.yaml, config/ 서브디렉터리 없이)에 두었다가, ChunkRepositoryIntegrationTest 등
# 이 카드와 무관한 기존 통합 테스트까지 전부 "Failed to determine a suitable driver class"로
# 깨지는 것을 ./mvnw test 로 실측하고 나서 이 경로(config/ 서브디렉터리)로 옮겼다. 원인:
# Maven의 테스트 클래스패스는 target/test-classes 가 target/classes 보다 먼저 오고,
# classpath:/application.yaml 같은(와일드카드 없는) 단일 리소스 조회는 클래스로더가 "처음 찾은
# 것 하나"만 반환한다 -- 즉 src/test/resources/application.yaml 이 src/main/resources/
# application.yaml 을 "병합"하는 게 아니라 완전히 "가려버려서" DataSource·spring.config.import
# (infra/.env) 등 그 파일에만 있던 모든 설정이 테스트 컨텍스트에서 통째로 사라졌다(실측:
# HikariDataSource가 "suitable driver class"를 못 찾음 = spring.datasource.url이 비어 있었다는
# 뜻). classpath:/config/application.yaml 은 그와 다른, 별개의 리소스 경로라 이런 충돌이 없다.
#
# 목적(review 2026-08-26_document-ingestion-T4.md High-2 재작업): 이전에는 실제 OpenRouter
# base-url/api-key를 막는 더미 값이 application-test.yaml에만 있어, IntegrationTestBase를
# 상속하지 않는 컨텍스트(예: migration 패키지의 스키마 검증 테스트)가 IntelliJ에서 직접 실행되면
# (Surefire를 거치지 않아 pom.xml의 systemPropertyVariables 방어선도 없음) 실제 키가 그대로
# 해석되는 통로가 있었다. 이 파일은 그 통로를 프로파일·실행 방식과 무관하게 막는다.
#
# [review 원문과의 의도적 차이] review는 spring.autoconfigure.exclude(OpenAiChatAutoConfiguration/
# OpenAiEmbeddingAutoConfiguration)까지 이 파일로 옮기라고 지시했으나, 실측 결과(review
# 2026-08-26_document-ingestion-T4.md 재작업 중 spring-ai-autoconfigure-vector-store-pgvector:
# 2.0.1 소스를 직접 읽음) 그 배제를 프로파일 밖(=모든 컨텍스트)으로 옮기면
# PgVectorStoreAutoConfiguration의 vectorStore 빈 메서드가 EmbeddingModel을 ObjectProvider 없는
# 필수 파라미터로 요구하므로, StubEmbeddingModelConfig를 임포트하지 않는 기존 @SpringBootTest
# (migration 패키지 등 -- 이번 카드 범위(support/ 패키지, application-test.yaml, pom.xml)
# 밖이라 그 파일들을 IntegrationTestBase 하위로 옮기는 수정은 할 수 없음)가 컨텍스트 기동 자체에
# 실패해 격리 강화가 아니라 회귀가 된다. 그래서 exclude는 application-test.yaml(프로파일 전용,
# StubEmbeddingModelConfig/StubChatModelConfig가 그 자리를 대신 채우는 IntegrationTestBase
# 하위 클래스에서만 활성화)에 그대로 남기고, 여기서는 "실제 빈이 뜨더라도 물리적으로 나갈 수
# 없게"만 한다 -- review가 지적한 실제 문제(대상 테스트가 실제 키로 실제 호출을 시도할 수 있었다는
# 것) 자체는 이 조합으로 완전히 막힌다. 어떤 컨텍스트에서도 실제 빈 자체가 아예 존재하지 않는
# 구조적 보장까지 원한다면, test-scope AutoConfiguration.imports(SPI)로 스텁을 전역 자동구성하는
# 별도 카드가 필요하다(이번 카드 범위 밖, dev-log follow_up에 기록).
#
# 공통 레벨(spring.ai.openai.*)뿐 아니라 모델 레벨(spring.ai.openai.chat.*, .embedding.*)도
# 함께 못박는다 -- OpenAiAutoConfigurationUtil#resolveCommonProperties(spring-ai-autoconfigure-
# model-openai:2.0.1 소스 실측, AbstractOpenAiProperties가 baseUrl/apiKey를 chat/embedding 양쪽
# @ConfigurationProperties 클래스에 그대로 상속시킴도 함께 확인)가 모델 레벨 값이 존재하면
# 공통 레벨보다 그것을 항상 우선 채택하므로, 공통 레벨만 막으면 모델 레벨 프로퍼티가 추가되는
# 순간(review 2026-08-26_document-ingestion-T4.md security Medium-1) 이 방어선 전체가 조용히
# 무력화된다.
spring:
  ai:
    openai:
      base-url: http://127.0.0.1:1
      api-key: dummy-test-key-do-not-call-openrouter
      chat:
        base-url: http://127.0.0.1:1
        api-key: dummy-test-key-do-not-call-openrouter
      embedding:
        base-url: http://127.0.0.1:1
        api-key: dummy-test-key-do-not-call-openrouter
  # [X1, 2026-08-28, round 2] 테스트 전용 HikariCP 상한. ./mvnw test 전체 회귀가 커넥션 슬롯
  # 고갈로 결정론적으로 실패(291건 중 2건) -- 원인은 경합이 아니라 컨텍스트 캐시 누적
  # (@SpringBootTest 21개 클래스 실측, 20개는 자동 마이그레이션·1개(V1InitSchemaIntegrationTest)
  # 만 직접 migrate() 호출; 컨텍스트 분기 수는 11개(review round3 실측 확정), 최악값 21로
  # 계산해도 결론 유지).
  # 비-프로파일 파일에 두는 이유는 IntegrationTestBase 밖 컨텍스트도 여기서 실제 DataSource를
  # 얻기 때문 -- 회귀 감지: ConfigApplicationYamlAppliesOutsideIntegrationTestBaseTest.
  # [값=3] pool=1 실측(V1InitSchemaIntegrationTest의 migrate()가 "total=1, active=1"로
  # 타임아웃)이 migrate() 1회가 main+migration 두 물리 커넥션을 동시에 요구함(필요량 2)을
  # 확정했다. "정확히 2"는 1R의 pool=2 실행(BackendApplicationTests·SessionControllerIntegration
  # Test 전부 PASS, 둘 다 자동 마이그레이션 경로)이 피크 ≤ 2임을 보여준 데서 온다. PostgreSQL
  # Database(flyway-database-postgresql-12.4.0-sources.jar:114)는 useSingleConnection()을
  # 오버라이드하지만 flyway.postgresql.transactional.lock 기본값(true)에서 반환값은 base
  # Database 기본값과 동일한 false -- 오버라이드는 존재하나 이 프로젝트 설정에선 효과가 base와
  # 같다(1R의 "미오버라이드" 서술은 flyway-core sources만 검색해 부정확했음, review
  # 2026-08-28_X1-test-pool-size-round2.md Medium-1). [round3 Low-1] false 명시 시
  # useSingleConnection()=true -> Database.java:305-306이 커넥션 재사용, 필요량 2->1(미사용,
  # 값 변경 아님, 후보 기록). 필요량 2 + 여유 1 = 3 -- 21×3=63<97은 값 3의 보수적 상한 확인,
  # 실측 피크는 아래 minimum-idle 절 참고. 되돌리려면 세 키를 지우면 기본값(10,
  # minIdle=maxPoolSize 보정, 30s)으로 복귀 -- 재발 시 값보다 컨텍스트 분기 수 증가를 먼저
  # 의심할 것. 조사 경과 상세는 dev-log 참고.
  datasource:
    hikari:
      maximum-pool-size: 3
      # [round3, 실측] 컨텍스트 11개 x 상주 2 + 감시 세션 1 = 23 -- 1초 간격 pg_stat_activity
      # 샘플링 실측(2026-08-28 11:49 배타 창). minimum-idle=1의 효과는 위 필요량 2의 생성을 막는
      # 게 아니라 fillPool(HikariPool.java:525-534)의 선제 충전을 3->1로 줄이는 것 -- 2번째
      # 커넥션은 여전히 만들어지고 idleTimeout 기본 10분(HikariConfig.java:53,125) 안에는
      # 회수도 안 된다. [round3 Low-2] "무관한 손잡이"가 아니라 "아직 안 당긴 손잡이" -- 하한
      # 10000ms(HikariConfig.java:1145)로 주면 피크가 낮아질 수 있음(미검증, 지금은 미변경,
      # 재발 시 1순위 후보). 여유는 (97-1)/2 ~= 48개 컨텍스트까지(현재 11개, 단위는 클래스가
      # 아니라 캐시된 컨텍스트).
      minimum-idle: 1
      # 기본 30s → 5s. pool=1 실험에서 5006ms 만에 실패한 실측(dev-log)이 근거이며 제시 범위
      # (5~10초)의 하한이다. loginTimeout도 같이 30s→5s로 낮아진다(HikariCP PoolBase.java:
      # 641-643) -- 콜드스타트로 SQLTransientConnectionException이 관측되면 8~10초 상향을
      # 검토할 것, 지금은 바꾸지 않는다(review 2026-08-28_X1-test-pool-size-round2.md
      # L-2/L-4/L-6).
      connection-timeout: 5000

# review 2026-08-27_document-ingestion-T4-round2.md Medium-E: pom.xml surefire의
# systemPropertyVariables는 OPENROUTER_API_KEY까지 더미로 강제하는데(E5/eval 실호출 카드가 읽는
# 원시 환경변수 이름 -- infra/.env 참고), 이 config-data 계층은 그동안 spring.ai.openai.* 6개
# 키만 포이즌하고 이 키는 빠뜨려 surefire 계층과 비대칭이었다. 이 키를 직접 읽는 프로덕션 코드는
# 현재 없으나(즉시 악용 경로 없음), 방어선 밖 미래 변경에 대비해 두 계층을 대칭으로 맞춘다.
OPENROUTER_API_KEY: dummy-test-key-do-not-call-openrouter

# review 2026-08-27_document-ingestion-T4-round2.md High-1: 위 spring.ai.openai.* 6개 키 +
# OPENROUTER_API_KEY는 pom.xml surefire의 systemPropertyVariables가 JVM 시스템 프로퍼티로 동일
# 값을 강제하기도 한다(Spring Boot 프로퍼티 우선순위: 시스템 프로퍼티 > config-data 파일). 그래서
# ./mvnw test로 실행하면 이 파일을 통째로 지워도 그 값들은 시스템 프로퍼티로 그대로 남아, 이 파일
# 자체가 실제로 로드됐는지는 그 키들만으로 구분할 수 없다. 아래 키는 surefire 어디에도 없으므로
# 이 파일이 사라지면 즉시 null로 관측된다 -- 이 값만이 "이 파일이 실제로 로드됐다"는 것의 유일한
# 자동화된 증거다. 프로덕션 코드와는 무관한 테스트 전용 표시자이며, 다른 목적으로 재사용하지 말 것.
qa:
  config-application-yaml-loaded: "true"
